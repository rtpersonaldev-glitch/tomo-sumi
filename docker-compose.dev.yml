services:
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile.dev
    container_name: tomo-frontend-dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
      - VITE_WS_BASE_URL=ws://localhost:8000
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile.dev
    container_name: tomo-backend-dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - media_dev_volume:/app/media
    environment:
      - DATABASE_URL=postgresql+asyncpg://tomo:tomo@db:5432/tomo_dev
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=dev-secret-key-change-in-production
      - DEBUG=true
      - CORS_ORIGINS=["http://localhost:5173"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile.dev
    container_name: tomo-worker-dev
    command: celery -A app.tasks.celery_app worker --loglevel=debug --concurrency=2
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://tomo:tomo@db:5432/tomo_dev
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=dev-secret-key-change-in-production
    depends_on:
      - backend
      - redis

  beat:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile.dev
    container_name: tomo-beat-dev
    command: celery -A app.tasks.celery_app beat --loglevel=debug
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://tomo:tomo@db:5432/tomo_dev
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=dev-secret-key-change-in-production
    depends_on:
      - worker

  db:
    image: postgres:16-alpine
    container_name: tomo-db-dev
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=tomo_dev
      - POSTGRES_USER=tomo
      - POSTGRES_PASSWORD=tomo
    volumes:
      - postgres_dev_volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tomo -d tomo_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tomo-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_volume:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_dev_volume:
  redis_dev_volume:
  media_dev_volume:
