name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: バックエンドテスト
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tomo_test
          POSTGRES_USER: tomo
          POSTGRES_PASSWORD: tomo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Python 3.12 セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Poetry インストール
        run: pip install poetry

      - name: 依存パッケージインストール
        working-directory: backend
        run: |
          poetry config virtualenvs.create false
          poetry install --no-root

      - name: pytest 実行（カバレッジ付き）
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://tomo:tomo@localhost:5432/tomo_test
          DATABASE_URL: postgresql+asyncpg://tomo:tomo@localhost:5432/tomo_test
          SECRET_KEY: ci-test-secret-key
          REDIS_URL: redis://localhost:6379/0
          DEBUG: "true"
        run: |
          pytest tests/ --cov=app --cov-report=term-missing --tb=short -q

  frontend-check:
    name: フロントエンド型チェック・Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Node.js 20 セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 依存パッケージインストール
        working-directory: frontend
        run: npm ci

      - name: TypeScript 型チェック
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint
