name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: バックエンドテスト
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tomo_test
          POSTGRES_USER: tomo
          POSTGRES_PASSWORD: tomo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Python 3.12 セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Poetry インストール
        run: pip install poetry

      - name: 依存パッケージインストール
        working-directory: backend
        run: |
          poetry config virtualenvs.create false
          poetry install --no-root

      - name: pytest 実行（カバレッジ付き）
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://tomo:tomo@localhost:5432/tomo_test
          DATABASE_URL: postgresql+asyncpg://tomo:tomo@localhost:5432/tomo_test
          SECRET_KEY: ci-test-secret-key
          REDIS_URL: redis://localhost:6379/0
          DEBUG: "true"
          MEDIA_ROOT: /tmp/tomo-media
          MEDIA_BASE_URL: http://localhost:8000/media
          FIREBASE_SERVICE_ACCOUNT_PATH: /nonexistent/firebase.json
        run: |
          pytest tests/ --cov=app --cov-report=term-missing --tb=short -q

  frontend-check:
    name: フロントエンド型チェック・Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Node.js 20 セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 依存パッケージインストール
        working-directory: frontend
        run: npm ci

      - name: TypeScript 型チェック
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

  deploy:
    name: 本番デプロイ
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: SSH でデプロイ
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/tomo-sumi
            git pull origin main
            docker compose build
            docker compose up -d
            docker compose exec -T backend alembic upgrade head
            echo "デプロイ完了"
